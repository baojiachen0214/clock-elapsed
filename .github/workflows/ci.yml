name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Unit tests
        run: ./test.sh
      - name: Build (ad-hoc signed, no installation)
        run: ./build.sh
      - name: Validate installer without changing the machine
        run: |
          zsh -n build.sh install.sh package.sh Tools/notarize.sh
          xcrun swiftc -typecheck Installer/main.swift
          ./install.sh --validate output/ClockElapsed.app
